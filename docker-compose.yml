services:
  postgres:
    image: paradedb/paradedb:latest
    ports:
      - "17:5432"
    environment:
      POSTGRES_DB: neo_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
