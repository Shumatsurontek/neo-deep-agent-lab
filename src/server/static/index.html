<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Deep Agent Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        #chat { scroll-behavior: smooth; }
        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        .typing::after {
            content: '';
            display: inline-block;
            width: 6px; height: 6px;
            background: #9ca3af;
            border-radius: 50%;
            animation: blink 1s infinite;
            margin-left: 4px;
            vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        pre { white-space: pre-wrap; word-wrap: break-word; }

        /* Tool step panels */
        .tool-step { border-left: 2px solid #374151; margin: 8px 0; }
        .tool-step.running { border-left-color: #f59e0b; }
        .tool-step.done { border-left-color: #10b981; }
        .tool-step summary { cursor: pointer; list-style: none; user-select: none; }
        .tool-step summary::-webkit-details-marker { display: none; }
        .tool-step summary::before {
            content: '\25B6'; margin-right: 6px; font-size: 0.55em;
            transition: transform 0.2s; display: inline-block; vertical-align: middle;
        }
        .tool-step[open] summary::before { transform: rotate(90deg); }

        /* Markdown tables */
        .md-table { border-collapse: collapse; font-size: 0.75rem; width: 100%; }
        .md-table th, .md-table td {
            border: 1px solid #374151; padding: 3px 8px; text-align: left;
        }
        .md-table th { background: #1f2937; font-weight: 600; color: #9ca3af; }
        .md-table td { color: #d1d5db; }
        .md-table tr:hover td { background: #111827; }

        /* Assistant message group */
        .msg-group { max-width: 56rem; }
        .msg-text p { margin: 0.25em 0; }
        .msg-text p:first-child { margin-top: 0; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-3 bg-gray-900 border-b border-gray-800 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-sm">N</div>
            <h1 class="text-lg font-semibold">Neo Deep Agent Lab</h1>
            <span class="text-xs text-gray-500 hidden sm:inline">SQL Agent + Modal Sandbox</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="status" class="text-xs text-green-400">Ready</span>
            <button onclick="resetChat()" class="px-3 py-1 text-xs bg-gray-800 hover:bg-gray-700 rounded-md border border-gray-700 transition">
                Reset
            </button>
        </div>
    </header>

    <!-- Chat -->
    <main id="chat" class="flex-1 overflow-y-auto px-4 py-6 space-y-4">
        <div class="text-center text-gray-500 text-sm py-8">
            Pose une question sur la base de donnees Neo.<br>
            <span class="text-xs text-gray-600">L'agent genere du SQL, l'execute dans un sandbox isole, et repond en francais.</span>
        </div>
    </main>

    <!-- Input -->
    <footer class="shrink-0 px-4 py-3 bg-gray-900 border-t border-gray-800">
        <form onsubmit="sendMessage(event)" class="flex gap-3 max-w-4xl mx-auto">
            <input
                id="input"
                type="text"
                placeholder="Ex: Combien d'agents sont configures ?"
                autocomplete="off"
                class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition placeholder-gray-500"
            />
            <button
                id="sendBtn"
                type="submit"
                class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed"
            >
                Envoyer
            </button>
        </form>
    </footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
let isStreaming = false;

/* ── History ─────────────────────────────────── */

async function loadHistory() {
    try {
        const res = await fetch('/history');
        const data = await res.json();
        if (data.messages && data.messages.length > 0) {
            chat.innerHTML = '';
            for (const msg of data.messages) {
                if (msg.role === 'user') appendUserBubble(msg.content);
                else if (msg.role === 'assistant') {
                    const group = createAssistantGroup();
                    group.textEl.innerHTML = renderMarkdown(msg.content);
                }
            }
            scrollToBottom();
        }
    } catch (e) { /* ignore */ }
}

/* ── DOM builders ────────────────────────────── */

function appendUserBubble(text) {
    const wrapper = document.createElement('div');
    wrapper.className = 'flex justify-end';
    wrapper.innerHTML = `
        <div class="max-w-2xl bg-blue-600 rounded-2xl rounded-br-sm px-4 py-2.5 text-sm">
            ${escapeHtml(text)}
        </div>`;
    chat.appendChild(wrapper);
    scrollToBottom();
}

function createAssistantGroup() {
    // Outer wrapper: left-aligned
    const outer = document.createElement('div');
    outer.className = 'flex justify-start';

    // Message group: contains avatar + content column
    const group = document.createElement('div');
    group.className = 'msg-group flex gap-3 max-w-3xl';

    // Avatar
    const avatar = document.createElement('div');
    avatar.className = 'w-7 h-7 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-xs font-bold text-blue-400 shrink-0 mt-0.5';
    avatar.textContent = 'A';

    // Content column
    const content = document.createElement('div');
    content.className = 'flex-1 min-w-0';

    // Text container (for streaming text)
    const textEl = document.createElement('div');
    textEl.className = 'msg-text text-sm leading-relaxed text-gray-200';

    // Steps container (tool panels go here, inline)
    const stepsEl = document.createElement('div');
    stepsEl.className = 'msg-steps';

    content.appendChild(stepsEl);
    content.appendChild(textEl);
    group.appendChild(avatar);
    group.appendChild(content);
    outer.appendChild(group);
    chat.appendChild(outer);
    scrollToBottom();

    return { outer, textEl, stepsEl };
}

function createToolStep(toolName, stepsEl) {
    const details = document.createElement('details');
    details.className = 'tool-step running rounded-md bg-gray-900/60 px-3 py-1.5 text-xs';

    const summary = document.createElement('summary');
    summary.className = 'flex items-center gap-2 py-0.5';
    summary.innerHTML = `
        <svg class="w-3 h-3 text-amber-400 spinner shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="font-medium text-amber-400">${escapeHtml(toolName)}</span>
        <span class="tool-badge text-gray-600 ml-auto">en cours...</span>`;

    const body = document.createElement('div');
    body.className = 'tool-body mt-1.5 mb-1';

    details.appendChild(summary);
    details.appendChild(body);
    stepsEl.appendChild(details);
    scrollToBottom();

    return { details, summary, body };
}

function finalizeToolStep(step, toolOutput, toolInput) {
    const { details, summary, body } = step;

    // Styling: running → done
    details.classList.remove('running');
    details.classList.add('done');

    // Icon: spinner → check
    const svg = summary.querySelector('svg');
    if (svg) {
        svg.classList.remove('spinner');
        svg.outerHTML = `
            <svg class="w-3 h-3 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>`;
    }

    // Label color
    const label = summary.querySelector('.font-medium');
    if (label) { label.classList.remove('text-amber-400'); label.classList.add('text-emerald-400'); }

    // Badge
    const badge = summary.querySelector('.tool-badge');
    if (badge) {
        const len = toolOutput.length;
        badge.textContent = len > 100 ? `${(len / 1024).toFixed(1)} KB` : 'ok';
        badge.classList.remove('text-gray-600');
        badge.classList.add('text-gray-500');
    }

    // Body: input + output
    let html = '';

    // Input section
    if (toolInput && typeof toolInput === 'object' && Object.keys(toolInput).length > 0) {
        const display = toolInput.query || toolInput.table_name || JSON.stringify(toolInput, null, 2);
        html += `<div class="mb-2">
            <div class="text-[10px] uppercase tracking-wider text-gray-500 font-semibold mb-1">Requete</div>
            <pre class="text-blue-300/90 bg-gray-950/60 rounded px-2 py-1.5 text-[11px] leading-relaxed overflow-x-auto">${escapeHtml(display)}</pre>
        </div>`;
    }

    // Output section
    const truncated = toolOutput.length > 3000 ? toolOutput.slice(0, 3000) + '\n...(tronque)' : toolOutput;

    if (looksLikeTable(truncated)) {
        html += `<div>
            <div class="text-[10px] uppercase tracking-wider text-gray-500 font-semibold mb-1">Resultat</div>
            <div class="overflow-x-auto">${renderPsqlTable(truncated)}</div>
        </div>`;
    } else {
        html += `<div>
            <div class="text-[10px] uppercase tracking-wider text-gray-500 font-semibold mb-1">Resultat</div>
            <pre class="text-gray-400 bg-gray-950/40 rounded px-2 py-1.5 text-[11px] overflow-x-auto">${escapeHtml(truncated)}</pre>
        </div>`;
    }

    body.innerHTML = html;
}

/* ── Streaming ───────────────────────────────── */

async function sendMessage(e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || isStreaming) return;

    isStreaming = true;
    sendBtn.disabled = true;
    input.value = '';
    statusEl.textContent = 'Streaming...';
    statusEl.className = 'text-xs text-amber-400';

    appendUserBubble(text);
    const group = createAssistantGroup();
    group.textEl.classList.add('typing');

    let fullText = '';
    let activeTools = {};  // key → step (unique per tool call)
    let toolIdx = 0;
    let lastToolKey = null;  // track last started tool for end matching

    try {
        const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                let event;
                try { event = JSON.parse(line.slice(6)); } catch { continue; }

                switch (event.type) {
                    case 'text-delta':
                        fullText += event.content;
                        group.textEl.innerHTML = renderMarkdown(fullText);
                        scrollToBottom();
                        break;

                    case 'tool-call-start': {
                        const name = event.tool_name;
                        const key = name + '_' + (toolIdx++);
                        const step = createToolStep(name, group.stepsEl);
                        activeTools[key] = { step, name };
                        lastToolKey = key;

                        // Show initial input if available
                        if (event.tool_input && Object.keys(event.tool_input).length > 0) {
                            const q = event.tool_input.query || event.tool_input.table_name || JSON.stringify(event.tool_input, null, 2);
                            step.body.innerHTML = `<pre class="text-blue-300/70 text-[11px]">${escapeHtml(q)}</pre>
                                <div class="text-gray-600 italic mt-1">Execution...</div>`;
                        }
                        break;
                    }

                    case 'tool-call-end': {
                        const name = event.tool_name;
                        // Find the matching active tool (FIFO by name)
                        const matchKey = Object.keys(activeTools).find(k => activeTools[k].name === name);
                        if (matchKey) {
                            finalizeToolStep(activeTools[matchKey].step, event.tool_output || '', event.tool_input || null);
                            delete activeTools[matchKey];
                        }
                        break;
                    }

                    case 'error':
                        group.textEl.innerHTML += `<div class="text-red-400 mt-2 text-xs border border-red-900 rounded px-3 py-2 bg-red-950/30">Erreur: ${escapeHtml(event.message)}</div>`;
                        break;

                    case 'done':
                        break;
                }
            }
        }
    } catch (err) {
        group.textEl.innerHTML += `<div class="text-red-400 mt-2 text-xs">Erreur reseau: ${escapeHtml(err.message)}</div>`;
    }

    // Finalize pending tool panels
    for (const [, entry] of Object.entries(activeTools)) {
        finalizeToolStep(entry.step, '(pas de resultat)', null);
    }

    group.textEl.classList.remove('typing');
    isStreaming = false;
    sendBtn.disabled = false;
    statusEl.textContent = 'Ready';
    statusEl.className = 'text-xs text-green-400';
    input.focus();
}

async function resetChat() {
    try {
        await fetch('/reset', { method: 'POST' });
        chat.innerHTML = `
            <div class="text-center text-gray-500 text-sm py-8">
                Conversation reinitialisee.<br>
                <span class="text-xs text-gray-600">Pose une nouvelle question.</span>
            </div>`;
    } catch (e) { console.error('Reset failed', e); }
}

/* ── Rendering helpers ───────────────────────── */

function looksLikeTable(text) {
    const lines = text.trim().split('\n');
    if (lines.length < 2) return false;
    // psql CSV or pipe-delimited
    return (lines[0].includes('|') && lines.length >= 2) ||
           (lines[0].includes(',') && lines[0].split(',').length >= 2 && lines.length >= 2);
}

function renderPsqlTable(text) {
    const lines = text.trim().split('\n').filter(l => l.trim());
    if (lines.length === 0) return escapeHtml(text);

    // Detect delimiter: pipe or comma
    const delim = lines[0].includes('|') ? '|' : ',';
    const parseRow = r => r.split(delim).map(c => c.trim()).filter(c => c !== '');

    const headers = parseRow(lines[0]);
    if (headers.length === 0) return escapeHtml(text);

    // Skip separator lines (--- or ===)
    let startIdx = 1;
    if (lines[1] && /^[\s|+\-=]+$/.test(lines[1])) startIdx = 2;

    let html = '<table class="md-table"><thead><tr>';
    for (const h of headers) html += `<th>${escapeHtml(h)}</th>`;
    html += '</tr></thead><tbody>';

    for (let i = startIdx; i < lines.length; i++) {
        if (/^[\s|+\-=]+$/.test(lines[i])) continue; // skip separators
        if (/^\(\d+ rows?\)/.test(lines[i].trim())) continue; // skip "(N rows)"
        const cells = parseRow(lines[i]);
        if (cells.length === 0) continue;
        html += '<tr>';
        for (const c of cells) html += `<td>${escapeHtml(c)}</td>`;
        html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
}

function renderMarkdown(text) {
    let html = escapeHtml(text);
    // Bold
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code class="bg-gray-700/50 px-1 rounded text-xs text-blue-300">$1</code>');
    // Code blocks
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
        `<pre class="bg-gray-900 rounded-lg p-3 mt-2 mb-2 text-xs overflow-x-auto border border-gray-800"><code>${code}</code></pre>`
    );
    // Markdown tables (pipe-delimited)
    html = html.replace(/((?:\|.*\|(?:\n|$))+)/g, (match) => {
        const rows = match.trim().split('\n').filter(r => r.trim());
        if (rows.length < 2) return match;
        const parseRow = r => r.split('|').filter(c => c.trim() !== '').map(c => c.trim());
        const headers = parseRow(rows[0]);
        const startIdx = rows[1] && /^[\s|-]+$/.test(rows[1]) ? 2 : 1;
        let table = '<div class="overflow-x-auto my-2"><table class="md-table"><thead><tr>';
        for (const h of headers) table += `<th>${h}</th>`;
        table += '</tr></thead><tbody>';
        for (let i = startIdx; i < rows.length; i++) {
            const cells = parseRow(rows[i]);
            table += '<tr>';
            for (const c of cells) table += `<td>${c}</td>`;
            table += '</tr>';
        }
        table += '</tbody></table></div>';
        return table;
    });
    // Headings
    html = html.replace(/^### (.+)$/gm, '<h3 class="text-sm font-semibold mt-3 mb-1 text-gray-300">$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2 class="text-base font-semibold mt-3 mb-1 text-gray-200">$1</h2>');
    // Lists
    html = html.replace(/^- (.+)$/gm, '<li class="ml-4 text-gray-300">$1</li>');
    html = html.replace(/(<li.*<\/li>\n?)+/g, '<ul class="list-disc my-1">$&</ul>');
    // Paragraphs
    html = html.replace(/\n\n/g, '</p><p>');
    html = html.replace(/\n/g, '<br>');
    return `<p>${html}</p>`;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function scrollToBottom() {
    requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
}

/* ── Init ────────────────────────────────────── */
loadHistory();
input.focus();
</script>
</body>
</html>
